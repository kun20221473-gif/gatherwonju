<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모으다 원주 - 원주 행사 정보</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Leaflet CSS & JS CDN (임시 지도) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* Pretendard/Inter 폰트 지정 및 모바일 터치 최적화 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 스크롤바 숨기기 (모바일 뷰) */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Leaflet 지도 핀 커스텀 애니메이션 */
    .custom-leaflet-marker {
      transition: transform 0.2s ease;
    }
    .custom-leaflet-marker:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex justify-center min-h-screen">

  <!-- 모바일 프레임 컨테이너 (최대 440px 모바일 화면 고정) -->
  <div id="app-container" class="w-full max-w-[440px] bg-slate-50 min-h-screen flex flex-col shadow-2xl relative pb-20 overflow-x-hidden">

    <!-- 1. 헤더 영역 -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-sm">
          원
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight text-slate-900 tracking-tight">모으다 원주</h1>
          <p class="text-[10px] text-emerald-600 font-semibold tracking-wide">강원특별자치도 원주시 행사 안내</p>
        </div>
      </div>
      <button id="refresh-btn" onclick="fetchEvents()" class="p-2 text-slate-500 hover:text-emerald-600 active:scale-95 transition-all">
        <i class="ph ph-arrows-clockwise text-xl"></i>
      </button>
    </header>

    <!-- 2. 메인 컨텐츠 영역 -->
    <main class="flex-1 p-4 space-y-5 overflow-y-auto">

      <!-- 2-1. 상단 D-Day 주요 카운트다운 카드 -->
      <section id="hero-card-section">
        <!-- 스켈레톤 로딩 -->
        <div id="hero-skeleton" class="animate-pulse bg-slate-200 rounded-2xl h-44 w-full"></div>

        <!-- 실제 히어로 카드 (JS 동적 삽입) -->
        <div id="hero-card" class="hidden bg-gradient-to-br from-emerald-600 to-teal-700 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
          <div class="absolute -right-4 -bottom-4 w-32 h-32 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
          <div class="flex justify-between items-start mb-3">
            <span id="hero-badge" class="px-2.5 py-1 bg-white/20 backdrop-blur-md text-xs font-bold rounded-full text-white tracking-wide">
              대표 대표
            </span>
            <span id="hero-dday" class="text-2xl font-black tracking-tight text-emerald-200 bg-emerald-950/40 px-3 py-1 rounded-xl border border-emerald-400/30">
              D-Day
            </span>
          </div>
          <h2 id="hero-title" class="text-xl font-extrabold line-clamp-1 mb-1 text-white">행사명 불러오는 중...</h2>
          <p id="hero-place" class="text-xs text-emerald-100 flex items-center mb-4">
            <i class="ph ph-map-pin mr-1"></i> <span class="truncate">원주시 장소</span>
          </p>
          <div class="pt-3 border-t border-white/15 flex justify-between items-center text-xs text-emerald-100">
            <div>
              <span class="block text-[10px] opacity-80 uppercase tracking-wider">행사 기간</span>
              <span id="hero-period" class="font-semibold text-white">2026.00.00 ~ 2026.00.00</span>
            </div>
            <button id="hero-detail-btn" class="bg-white text-emerald-700 font-bold px-3 py-1.5 rounded-lg text-xs shadow hover:bg-emerald-50 active:scale-95 transition-all">
              상세보기
            </button>
          </div>
        </div>
      </section>

      <!-- 2-2. 카테고리 필터 탭 -->
      <section>
        <div class="flex space-x-2 bg-slate-200/70 p-1 rounded-xl">
          <button data-category="all" onclick="setCategory('all')" class="filter-tab flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white text-slate-800 shadow-sm">
            전체
          </button>
          <button data-category="festival" onclick="setCategory('festival')" class="filter-tab flex-1 py-2 text-xs font-bold text-slate-500 rounded-lg transition-all hover:text-slate-800">
            축제·영화제
          </button>
          <button data-category="popup" onclick="setCategory('popup')" class="filter-tab flex-1 py-2 text-xs font-bold text-slate-500 rounded-lg transition-all hover:text-slate-800">
            팝업·행사
          </button>
        </div>
      </section>

      <!-- 2-3. 지도 뷰 (기본 숨김 / 탭 전환) -->
      <section id="map-section" class="hidden space-y-2">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-xs font-bold text-slate-500 flex items-center">
            <i class="ph ph-map-trifold mr-1 text-emerald-600"></i> 행사 위치 지도
          </h3>
          <span class="text-[11px] text-slate-400">핀 클릭 시 상세 보기</span>
        </div>
        <div id="map" class="w-full h-64 rounded-2xl border border-slate-200 shadow-inner z-10"></div>
      </section>

      <!-- 2-4. 행사 목록 뷰 -->
      <section id="list-section" class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">
            진행 및 예정 행사 (<span id="event-count">0</span>)
          </h3>
        </div>

        <!-- 스켈레톤 리스트 -->
        <div id="list-skeleton" class="space-y-3">
          <div class="animate-pulse bg-white p-4 rounded-xl h-24 border border-slate-200"></div>
          <div class="animate-pulse bg-white p-4 rounded-xl h-24 border border-slate-200"></div>
        </div>

        <!-- 데이터 없음 메시지 -->
        <div id="empty-state" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 p-6">
          <i class="ph ph-calendar-x text-4xl text-slate-300 mb-2"></i>
          <p class="text-slate-500 font-bold text-sm">등록되었거나 예정된 행사가 없습니다.</p>
          <p class="text-xs text-slate-400 mt-1">카테고리를 변경하거나 나중에 다시 확인해주세요.</p>
        </div>

        <!-- 행사 목록 카드가 들어갈 컨테이너 -->
        <div id="events-list" class="space-y-3"></div>
      </section>

    </main>

    <!-- 3. 하단 네비게이션 바 -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[440px] bg-white border-t border-slate-200 py-2 px-6 flex justify-around items-center z-40 shadow-lg">
      <button id="nav-list-btn" onclick="switchView('list')" class="flex flex-col items-center text-emerald-600 font-bold text-xs space-y-1">
        <i class="ph ph-list-bullets text-xl"></i>
        <span>목록보기</span>
      </button>
      <button id="nav-map-btn" onclick="switchView('map')" class="flex flex-col items-center text-slate-400 font-medium text-xs space-y-1 hover:text-emerald-600 transition-colors">
        <i class="ph ph-map-pin-line text-xl"></i>
        <span>지도보기</span>

    </nav>

    <!-- 4. 상세 모달 (페이지 이동 효과) -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex justify-center items-end sm:items-center">
      <div class="bg-white w-full max-w-[440px] h-[90vh] sm:h-[85vh] rounded-t-3xl sm:rounded-2xl flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-300">
        
        <!-- 모달 헤더 -->
        <div class="relative bg-slate-900 text-white p-4 pt-6 flex-shrink-0">
          <button onclick="closeDetailModal()" class="absolute top-4 right-4 bg-white/20 hover:bg-white/30 text-white rounded-full p-1.5 transition-all">
            <i class="ph ph-x text-lg"></i>
          </button>
          <span id="modal-dday" class="inline-block px-2.5 py-0.5 bg-emerald-500 text-white font-bold text-xs rounded-md mb-2">
            D-Day
          </span>
          <h2 id="modal-title" class="text-xl font-bold leading-snug pr-8">행사 제목</h2>
        </div>

        <!-- 모달 메인 스크롤 영역 -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          
          <!-- 기본 정보 카드리스트 -->
          <div class="bg-slate-50 p-3.5 rounded-xl space-y-2 border border-slate-200/80 text-xs text-slate-700">
            <div class="flex items-start">
              <i class="ph ph-calendar-blank text-emerald-600 text-base mr-2 mt-0.5"></i>
              <div>
                <span class="font-bold text-slate-900">행사 기간</span>
                <p id="modal-period" class="text-slate-600">2026.00.00 ~ 2026.00.00</p>
              </div>
            </div>
            <div class="flex items-start">
              <i class="ph ph-map-pin text-emerald-600 text-base mr-2 mt-0.5"></i>
              <div>
                <span class="font-bold text-slate-900">장소</span>
                <p id="modal-place" class="text-slate-600">원주시 지정 장소</p>
              </div>
            </div>
          </div>

          <!-- 탭 버튼 (대중교통 / 주차 팁) -->
          <div class="border-b border-slate-200">
            <div class="flex space-x-6">
              <button id="tab-transit-btn" onclick="switchDetailTab('transit')" class="pb-2 text-xs font-bold text-emerald-600 border-b-2 border-emerald-600">
                <i class="ph ph-bus mr-1"></i> 대중교통
              </button>
              <button id="tab-parking-btn" onclick="switchDetailTab('parking')" class="pb-2 text-xs font-bold text-slate-400 hover:text-slate-700 border-b-2 border-transparent">
                <i class="ph ph-parking mr-1"></i> 주차 팁
              </button>
            </div>
          </div>

          <!-- 대중교통 탭 내용 -->
          <div id="tab-transit-content" class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                ⚠️ 샘플 데이터
              </span>
              <span class="text-[10px] text-slate-400">원주 시내버스 기반 샘플</span>
            </div>
            <div id="transit-info-container" class="space-y-2">
              <!-- JS 동적 생성 -->
            </div>
          </div>

          <!-- 주차 팁 탭 내용 (기본 숨김) -->
          <div id="tab-parking-content" class="hidden space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                ⚠️ 샘플 데이터
              </span>
              <span class="text-[10px] text-slate-400">원주 공영주차장 기준 샘플</span>
            </div>
            <div id="parking-info-container" class="space-y-2">
              <!-- JS 동적 생성 -->
            </div>
          </div>

        </div>

        <!-- 모달 푸터 (닫기 버튼) -->
        <div class="p-3 bg-slate-50 border-t border-slate-200 text-center flex-shrink-0">
          <button onclick="closeDetailModal()" class="w-full py-2.5 bg-slate-800 text-white font-bold text-xs rounded-xl hover:bg-slate-900 active:scale-95 transition-all">
            닫기
          </button>
        </div>

      </div>
    </div>

  </div>

  <!-- JavaScript Logic -->
  <script>
    /**
     * [TourAPI 미제공 부가 데이터 - 샘플 데이터 객체]
     * 키: 행사 ID (contentid) 또는 기본(default) 맵핑
     */
    const SAMPLE_ADDITIONAL_DATA = {
      "default": {
        transit: {
          buses: ["31번", "34-1번", "51번"],
          station: "원주시청 앞 / 단구동 주민센터 정류장",
          walk: "정류장에서 하차 후 도보 약 3분 (200m)"
        },
        parking: {
          mainParking: "행사장 내 임시 공영주차장 (약 80대 수용)",
          altParking: "원주시 보건소 주차장 또는 따뚜공연장 주차장",
          fee: "최초 30분 무료, 이후 10분당 200원 (행사 당일 무료 개방)"
        }
      },
      "dance_festival": {
        transit: {
          buses: ["2-1번", "30번", "90번"],
          station: "원주 따뚜공연장 · 댄싱공연장 정류장",
          walk: "정류장 바로 앞 (도보 1분)"
        },
        parking: {
          mainParking: "명륜동 체육공원 지하 주차장",
          altParking: "원주 종합운동장 야외 주차장",
          fee: "무료 개방"
        }
      }
    };

    // 애플리케이션 전역 상태 관리
    let allEvents = [];
    let currentCategory = 'all';
    let currentView = 'list'; // 'list' | 'map'
    let leafletMap = null;
    let mapMarkers = [];

    // 애플리케이션 초기화
    window.addEventListener('DOMContentLoaded', () => {
      fetchEvents();
    });

    /**
     * 서버리스 API (/api/tour) 호출
     */
    async function fetchEvents() {
      showLoading(true);

      try {
        const response = await fetch('/api/tour');
        
        if (!response.ok) {
          throw new Error(`서버 응답 오류: ${response.status}`);
        }

        const data = await response.json();

        if (data.success && Array.isArray(data.events)) {
          allEvents = data.events;
          renderApp();
        } else {
          throw new Error(data.error || '데이터를 가져오지 못했습니다.');
        }

      } catch (error) {
        console.error('행사 로딩 실패:', error);
        allEvents = getFallbackEvents();
        renderApp();
      } finally {
        showLoading(false);
      }
    }

    /**
     * API 호출 실패 시를 대비한 원주 지역 데모 데이터
     */
    function getFallbackEvents() {
      const today = new Date();
      const formatDate = (d) => d.toISOString().slice(0, 10).replace(/-/g, '');
      
      const d1 = new Date(today); d1.setDate(today.getDate() + 2);
      const d2 = new Date(today); d2.setDate(today.getDate() + 5);
      const d3 = new Date(today); d3.setDate(today.getDate() - 1);
      const d4 = new Date(today); d4.setDate(today.getDate() + 10);

      return [
        {
          id: "demo-1",
          title: "원주 다이내믹 댄싱카니발 팝업",
          startDate: formatDate(d1),
          endDate: formatDate(d2),
          addr: "강원특별자치도 원주시 단구로 170",
          place: "원주 댄싱공연장 일원",
          mapx: 127.9482,
          mapy: 37.3361,
          category: "festival"
        },
        {
          id: "demo-2",
          title: "원주 한지문화제 체험 행모음",
          startDate: formatDate(today),
          endDate: formatDate(d2),
          addr: "강원특별자치도 원주시 한지공원길 151",
          place: "원주한지테마파크",
          mapx: 127.9351,
          mapy: 37.3392,
          category: "festival"
        },
        {
          id: "demo-3",
          title: "치악산 산나물 팝업 마켓",
          startDate: formatDate(d4),
          endDate: formatDate(new Date(d4.getTime() + 86400000*2)),
          addr: "강원특별자치도 원주시 신림면 황둔리",
          place: "치악산 체험마을 광장",
          mapx: 128.0655,
          mapy: 37.2421,
          category: "popup"
        }
      ];
    }

    /**
     * D-Day 계산 함수 (한국 날짜 기준)
     */
    function calculateDDay(startDateStr, endDateStr) {
      if (!startDateStr) return { text: '정보 준비 중', status: 'unknown' };

      const parseDate = (str) => {
        if (!str || str.length < 8) return null;
        const y = parseInt(str.slice(0, 4), 10);
        const m = parseInt(str.slice(4, 6), 10) - 1;
        const d = parseInt(str.slice(6, 8), 10);
        return new Date(y, m, d);
      };

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      const start = parseDate(startDateStr);
      const end = endDateStr ? parseDate(endDateStr) : start;

      if (!start) return { text: '정보 준비 중', status: 'unknown' };

      const diffTime = start.getTime() - today.getTime();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays > 0) {
        return { text: `D-${diffDays}`, status: 'upcoming', days: diffDays };
      } else if (diffDays === 0) {
        return { text: 'D-Day', status: 'today', days: 0 };
      } else {
        if (end && today <= end) {
          return { text: '진행 중', status: 'ongoing', days: diffDays };
        } else {
          return { text: '종료', status: 'ended', days: diffDays };
        }
      }
    }

    /**
     * 날짜 포맷팅 (YYYYMMDD -> YYYY.MM.DD)
     */
    function formatDateDisplay(str) {
      if (!str || str.length < 8) return '정보 준비 중';
      return `${str.slice(0, 4)}.${str.slice(4, 6)}.${str.slice(6, 8)}`;
    }

    /**
     * 카테고리 설정 변경
     */
    function setCategory(category) {
      currentCategory = category;
      
      document.querySelectorAll('.filter-tab').forEach(tab => {
        if (tab.dataset.category === category) {
          tab.classList.add('bg-white', 'text-slate-800', 'shadow-sm');
          tab.classList.remove('text-slate-500');
        } else {
          tab.classList.remove('bg-white', 'text-slate-800', 'shadow-sm');
          tab.classList.add('text-slate-500');
        }
      });

      renderApp();
    }

    /**
     * 뷰 전환 (목록 / 지도)
     */
    function switchView(view) {
      currentView = view;
      const listSection = document.getElementById('list-section');
      const mapSection = document.getElementById('map-section');
      const listBtn = document.getElementById('nav-list-btn');
      const mapBtn = document.getElementById('nav-map-btn');

      if (view === 'list') {
        listSection.classList.remove('hidden');
        mapSection.classList.add('hidden');
        
        listBtn.className = 'flex flex-col items-center text-emerald-600 font-bold text-xs space-y-1';
        mapBtn.className = 'flex flex-col items-center text-slate-400 font-medium text-xs space-y-1 hover:text-emerald-600 transition-colors';
      } else {
        listSection.classList.add('hidden');
        mapSection.classList.remove('hidden');

        mapBtn.className = 'flex flex-col items-center text-emerald-600 font-bold text-xs space-y-1';
        listBtn.className = 'flex flex-col items-center text-slate-400 font-medium text-xs space-y-1 hover:text-emerald-600 transition-colors';

        // 지도 렌더링 초기화 및 마커 갱신
        const filtered = getFilteredEvents();
        setTimeout(() => {
          initMap();
          if (leafletMap) {
            leafletMap.invalidateSize(); // 지도 크기 재계산 (화면 깨짐 방지)
          }
          addMarkers(filtered);
        }, 100);
      }
    }

    /**
     * 카테고리 필터링된 목록 반환
     */
    function getFilteredEvents() {
      if (currentCategory === 'all') return allEvents;
      return allEvents.filter(e => e.category === currentCategory);
    }

    /**
     * UI 통합 렌더링
     */
    function renderApp() {
      const filteredEvents = getFilteredEvents();

      renderHeroCard();
      renderEventList(filteredEvents);

      if (currentView === 'map' && leafletMap) {
        addMarkers(filteredEvents);
      }
    }

    /**
     * 상단 히어로 카드 렌더링
     */
    function renderHeroCard() {
      const heroSkeleton = document.getElementById('hero-skeleton');
      const heroCard = document.getElementById('hero-card');

      if (!allEvents || allEvents.length === 0) {
        heroSkeleton.classList.add('hidden');
        heroCard.classList.add('hidden');
        return;
      }

      const upcomingEvents = allEvents
        .map(e => ({ ...e, ddayInfo: calculateDDay(e.startDate, e.endDate) }))
        .filter(e => e.ddayInfo.status === 'upcoming' || e.ddayInfo.status === 'today');

      let targetEvent = null;

      if (upcomingEvents.length > 0) {
        targetEvent = upcomingEvents[0];
      } else {
        const ongoingEvents = allEvents
          .map(e => ({ ...e, ddayInfo: calculateDDay(e.startDate, e.endDate) }))
          .filter(e => e.ddayInfo.status === 'ongoing');
        
        targetEvent = ongoingEvents.length > 0 ? ongoingEvents[0] : allEvents[0];
      }

      if (!targetEvent) return;

      const ddayInfo = targetEvent.ddayInfo || calculateDDay(targetEvent.startDate, targetEvent.endDate);

      document.getElementById('hero-badge').textContent = targetEvent.category === 'festival' ? '대표 축제' : '대표 행사';
      document.getElementById('hero-dday').textContent = ddayInfo.text;
      document.getElementById('hero-title').textContent = targetEvent.title;
      document.getElementById('hero-place').innerHTML = `<i class="ph ph-map-pin mr-1"></i> <span class="truncate">${targetEvent.place || '원주시 지정 장소'}</span>`;
      document.getElementById('hero-period').textContent = `${formatDateDisplay(targetEvent.startDate)} ~ ${formatDateDisplay(targetEvent.endDate)}`;

      document.getElementById('hero-detail-btn').onclick = () => openDetailModal(targetEvent.id);

      heroSkeleton.classList.add('hidden');
      heroCard.classList.remove('hidden');
    }

    /**
     * 행사 카드 리스트 렌더링
     */
    function renderEventList(events) {
      const listContainer = document.getElementById('events-list');
      const emptyState = document.getElementById('empty-state');
      const countEl = document.getElementById('event-count');

      countEl.textContent = events.length;
      listContainer.innerHTML = '';

      if (events.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      events.forEach(event => {
        const dday = calculateDDay(event.startDate, event.endDate);
        
        let ddayBg = 'bg-slate-100 text-slate-700';
        if (dday.status === 'today') ddayBg = 'bg-rose-500 text-white font-bold';
        else if (dday.status === 'upcoming') ddayBg = 'bg-emerald-600 text-white font-bold';
        else if (dday.status === 'ongoing') ddayBg = 'bg-amber-500 text-white font-bold';

        const categoryText = event.category === 'festival' ? '축제·영화제' : '팝업·행사';

        const cardHTML = `
          <div onclick="openDetailModal('${event.id}')" class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md active:scale-[0.99] transition-all cursor-pointer">
            <div class="flex justify-between items-start mb-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                ${categoryText}
              </span>
              <span class="text-xs px-2.5 py-1 rounded-lg ${ddayBg}">
                ${dday.text}
              </span>
            </div>
            
            <h4 class="font-bold text-slate-900 text-base mb-2.5 line-clamp-1">${event.title}</h4>
            
            <div class="space-y-1 text-xs text-slate-500">
              <div class="flex items-center">
                <i class="ph ph-calendar-blank text-slate-400 mr-1.5 text-sm"></i>
                <span>${formatDateDisplay(event.startDate)} ~ ${formatDateDisplay(event.endDate)}</span>
              </div>
              <div class="flex items-center">
                <i class="ph ph-map-pin text-slate-400 mr-1.5 text-sm"></i>
                <span class="truncate">${event.place || event.addr || '정보 준비 중'}</span>
              </div>
            </div>
          </div>
        `;
        listContainer.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    /**
     * 지도 API 초기화
     */
    function initMap() {
      if (leafletMap) return;

      leafletMap = L.map('map', {
        zoomControl: false
      }).setView([37.3422, 127.9201], 12);

      L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(leafletMap);
    }

    /**
     * 지도 핀 마커 추가
     */
    function addMarkers(events) {
      if (!leafletMap) return;

      mapMarkers.forEach(marker => leafletMap.removeLayer(marker));
      mapMarkers = [];

      const bounds = [];

      events.forEach(event => {
        if (event.mapy && event.mapx && event.mapy > 36 && event.mapy < 38) {
          const marker = L.marker([event.mapy, event.mapx], {
            title: event.title
          }).addTo(leafletMap);

          const dday = calculateDDay(event.startDate, event.endDate);

          marker.bindPopup(`
            <div style="font-family: Pretendard, sans-serif; padding: 4px;">
              <strong style="font-size: 13px; display: block; margin-bottom: 4px;">${event.title}</strong>
              <span style="font-size: 11px; color: #059669; font-weight: bold;">[${dday.text}]</span>
              <p style="font-size: 11px; color: #64748b; margin-top: 2px;">${event.place}</p>
              <button onclick="openDetailModal('${event.id}')" style="margin-top: 6px; width: 100%; background: #059669; color: white; border: none; padding: 4px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">
                상세 정보 보기
              </button>
            </div>
          `);

          mapMarkers.push(marker);
          bounds.push([event.mapy, event.mapx]);
        }
      });

      if (bounds.length > 0) {
        leafletMap.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    /**
     * 상세 보기 모달 오픈
     */
    function openDetailModal(eventId) {
      const event = allEvents.find(e => e.id === eventId);
      if (!event) return;

      const dday = calculateDDay(event.startDate, event.endDate);

      document.getElementById('modal-title').textContent = event.title;
      document.getElementById('modal-dday').textContent = dday.text;
      document.getElementById('modal-period').textContent = `${formatDateDisplay(event.startDate)} ~ ${formatDateDisplay(event.endDate)}`;
      document.getElementById('modal-place').textContent = event.place || event.addr || '정보 준비 중';

      const sample = SAMPLE_ADDITIONAL_DATA[event.id] || SAMPLE_ADDITIONAL_DATA["default"];
      renderTransitInfo(sample.transit);
      renderParkingInfo(sample.parking);

      switchDetailTab('transit');

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    /**
     * 상세 모달 내 탭 전환 (대중교통 vs 주차 팁)
     */
    function switchDetailTab(tabName) {
      const transitBtn = document.getElementById('tab-transit-btn');
      const parkingBtn = document.getElementById('tab-parking-btn');
      const transitContent = document.getElementById('tab-transit-content');
      const parkingContent = document.getElementById('tab-parking-content');

      if (tabName === 'transit') {
        transitBtn.className = 'pb-2 text-xs font-bold text-emerald-600 border-b-2 border-emerald-600';
        parkingBtn.className = 'pb-2 text-xs font-bold text-slate-400 hover:text-slate-700 border-b-2 border-transparent';
        transitContent.classList.remove('hidden');
        parkingContent.classList.add('hidden');
      } else {
        parkingBtn.className = 'pb-2 text-xs font-bold text-emerald-600 border-b-2 border-emerald-600';
        transitBtn.className = 'pb-2 text-xs font-bold text-slate-400 hover:text-slate-700 border-b-2 border-transparent';
        parkingContent.classList.remove('hidden');
        transitContent.classList.add('hidden');
      }
    }

    /**
     * 대중교통 샘플 데이터 렌더링
     */
    function renderTransitInfo(transit) {
      const container = document.getElementById('transit-info-container');
      
      if (!transit) {
        container.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">정보 준비 중</p>';
        return;
      }

      const busBadges = transit.buses.map(b => 
        `<span class="px-2 py-0.5 bg-blue-50 text-blue-700 font-bold rounded text-[11px] border border-blue-200">${b}</span>`
      ).join(' ');

      container.innerHTML = `
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/80 space-y-2 text-xs">
          <div>
            <span class="font-bold text-slate-700 block mb-1">인근 시내버스 노선</span>
            <div class="flex flex-wrap gap-1">${busBadges}</div>
          </div>
          <div class="pt-2 border-t border-slate-200/60">
            <span class="font-bold text-slate-700 block">주요 정류장</span>
            <p class="text-slate-600 mt-0.5">${transit.station || '정보 준비 중'}</p>
          </div>
          <div class="pt-2 border-t border-slate-200/60">
            <span class="font-bold text-slate-700 block">도보 동선</span>
            <p class="text-slate-600 mt-0.5">${transit.walk || '정보 준비 중'}</p>
          </div>
        </div>
      `;
    }

    /**
     * 주차 팁 샘플 데이터 렌더링
     */
    function renderParkingInfo(parking) {
      const container = document.getElementById('parking-info-container');

      if (!parking) {
        container.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">정보 준비 중</p>';
        return;
      }

      container.innerHTML = `
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/80 space-y-2 text-xs">
          <div>
            <span class="font-bold text-slate-700 block">인근 공영주차장</span>
            <p class="text-slate-600 mt-0.5">${parking.mainParking || '정보 준비 중'}</p>
          </div>
          <div class="pt-2 border-t border-slate-200/60">
            <span class="font-bold text-slate-700 block">혼잡 시 대체 주차장</span>
            <p class="text-slate-600 mt-0.5">${parking.altParking || '정보 준비 중'}</p>
          </div>
          <div class="pt-2 border-t border-slate-200/60">
            <span class="font-bold text-slate-700 block">주차 요금</span>
            <p class="text-slate-600 mt-0.5">${parking.fee || '정보 준비 중'}</p>
          </div>
        </div>
      `;
    }

    /**
     * 로딩 상태 제어
     */
    function showLoading(isLoading) {
      const heroSkeleton = document.getElementById('hero-skeleton');
      const listSkeleton = document.getElementById('list-skeleton');
      const heroCard = document.getElementById('hero-card');
      const eventsList = document.getElementById('events-list');

      if (isLoading) {
        heroSkeleton.classList.remove('hidden');
        listSkeleton.classList.remove('hidden');
        heroCard.classList.add('hidden');
        eventsList.innerHTML = '';
      } else {
        heroSkeleton.classList.add('hidden');
        listSkeleton.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
